[project]
name = "apass"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Shmakov",email = "nikshmakov@gmail.com"}
]

requires-python = ">=3.14"
dependencies = [
    "typer>=0.15,<1",
    "cryptography>=48,<49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
apass = "apass.cli:app"

[tool.poetry]
packages = [{include = "apass", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
